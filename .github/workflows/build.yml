name: Build and Release

# ═══════════════════════════════════════════════════════════════════
# ВАРІАНТ А — реліз за тегом.
#
# Версію задає ТЕГ, а не коміт. Workflow сам підставляє її в
# package.json перед збіркою, тому зворотних push-ів у репозиторій
# немає і зациклитись неможливо.
#
#   git tag v3.1.1
#   git push origin v3.1.1
#
# → збірка Windows + macOS → реліз v3.1.1 з .exe, .dmg, latest.yml
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - 'v*'
    branches:
      - main          # звичайний push у main = тільки перевірка, без релізу
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія для релізу (напр. 3.1.1). Порожньо = взяти з package.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────────────
  # Швидка перевірка на кожен push у main.
  # Ловить зламані залежності ДО того, як ви поставите тег.
  # ~1 хвилина, релізу не створює.
  # ─────────────────────────────────────────────────────────────────
  check:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Перевірка залежностей
        run: npm install

      - name: Перевірка синтаксису
        run: |
          node --check main.js
          for f in svarog-*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          echo "✅ Все на місці. Можна ставити тег."

  # ─────────────────────────────────────────────────────────────────
  # Реліз — тільки за тегом v* або ручним запуском
  # ─────────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Версія береться з тега (v3.1.1 → 3.1.1).
      # При ручному запуску — з поля вводу або з package.json.
      - name: Визначити версію
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Джерело: тег ${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Джерело: ручний ввід"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "Джерело: package.json"
          fi
          echo "Версія релізу: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # package.json синхронізується з тегом — electron-builder бере версію
      # саме звідси, і назва релізу збігається з тегом.
      - name: Підставити версію в package.json
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Встановити залежності
        run: npm install

      - name: Збірка Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Збірка macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Резервна копія артефактів
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
          retention-days: 5
          if-no-files-found: ignore
